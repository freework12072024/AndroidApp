version: '3.4'
services:
  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    ports:
      - "5127:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__SQLConnectionString=Server=db;Database=AuthDb;User Id=sa;Password=Your_password123;TrustServerCertificate=true
    depends_on:
      - db
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
volumes:
  mssqldata: { }
